<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 840" width="100%" height="100%">
  <defs>
    <!-- Dark Glass Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#070b14" />
      <stop offset="50%" stop-color="#0c1322" />
      <stop offset="100%" stop-color="#070b14" />
    </linearGradient>

    <!-- Card Backgrounds (Glassmorphic) -->
    <linearGradient id="cardBgDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#131d31" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#0d1525" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="cloudCardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c2340" stop-opacity="0.85" />
      <stop offset="100%" stop-color="#081528" stop-opacity="0.95" />
    </linearGradient>

    <!-- Agent Gradients -->
    <linearGradient id="a1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d1a04" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#140b02" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="a2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#04271d" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#02140e" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="a3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2d0814" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#150308" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="synGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="50%" stop-color="#581c87" />
      <stop offset="100%" stop-color="#3b0764" />
    </linearGradient>

    <linearGradient id="headerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="softGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="cyanGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.4" />
    </filter>

    <!-- Arrow Markers -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowAmber" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f59e0b" />
    </marker>
    <marker id="arrowEmerald" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowRose" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f43f5e" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <style>
    .title { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-weight: 800; }
    .heading { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-weight: 700; }
    .sub { font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif; font-weight: 500; }
    .mono { font-family: 'SF Mono', 'Fira Code', Menlo, Consolas, monospace; }
  </style>

  <!-- Canvas Background -->
  <rect width="1200" height="840" rx="20" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="1.5" />

  <!-- Ambient Decorative Grid -->
  <g opacity="0.04" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="140" x2="1200" y2="140" />
    <line x1="0" y1="280" x2="1200" y2="280" />
    <line x1="0" y1="480" x2="1200" y2="480" />
    <line x1="0" y1="680" x2="1200" y2="680" />
    <line x1="300" y1="0" x2="300" y2="840" />
    <line x1="600" y1="0" x2="600" y2="840" />
    <line x1="900" y1="0" x2="900" y2="840" />
  </g>

  <!-- Top System Header Bar -->
  <g transform="translate(50, 25)">
    <!-- Brand Icon -->
    <rect x="0" y="0" width="36" height="36" rx="8" fill="#f97316" opacity="0.2" />
    <rect x="0" y="0" width="36" height="36" rx="8" fill="none" stroke="#f97316" stroke-width="1.5" />
    <text x="18" y="24" text-anchor="middle" font-size="18">🌡️</text>

    <!-- Header Text -->
    <text x="50" y="20" class="title" font-size="20" fill="#ffffff" letter-spacing="0.5">ThermalOS</text>
    <text x="175" y="20" class="sub" font-size="13" fill="#64748b">— System Architecture &amp; Multi-Agent Dataflow</text>
    
    <!-- Status Pill -->
    <rect x="940" y="2" width="160" height="28" rx="14" fill="#022c22" stroke="#059669" stroke-width="1" />
    <circle cx="956" cy="16" r="4" fill="#10b981" />
    <text x="968" y="20" class="mono" font-size="11" font-weight="bold" fill="#6ee7b7">ENGINE ACTIVE</text>
  </g>

  <!-- ================= LEVEL 1: FORTYGUARD CLOUD PLATFORM ================= -->
  <g transform="translate(50, 75)" filter="url(#softGlow)">
    <rect width="1100" height="95" rx="14" fill="url(#cloudCardBg)" stroke="#0284c7" stroke-width="1.5" />
    
    <!-- Section Title -->
    <text x="24" y="28" class="heading" font-size="13" fill="#38bdf8" letter-spacing="0.5">☁️ FORTYGUARD ENTERPRISE MICROCLIMATE PLATFORM</text>
    <text x="420" y="28" class="sub" font-size="11" fill="#94a3b8">Large Temperature Models (LTMs) • Street-Level Urban Radiometry</text>
    
    <!-- Endpoint 1: Heatmap -->
    <g transform="translate(24, 42)">
      <rect width="510" height="40" rx="8" fill="#071527" stroke="#1e3a8a" stroke-width="1" />
      <rect x="12" y="10" width="46" height="20" rx="4" fill="#1d4ed8" />
      <text x="35" y="24" text-anchor="middle" class="mono" font-size="10" font-weight="bold" fill="#ffffff">POST</text>
      <text x="68" y="24" class="mono" font-size="12" font-weight="bold" fill="#38bdf8">/v1/heatmap</text>
      <text x="180" y="24" class="sub" font-size="11" fill="#94a3b8">60m–100m Radiometry (Ts, Ta, GHI, RH, Albedo)</text>
    </g>

    <!-- Endpoint 2: Quota -->
    <g transform="translate(560, 42)">
      <rect width="516" height="40" rx="8" fill="#071527" stroke="#1e3a8a" stroke-width="1" />
      <rect x="12" y="10" width="38" height="20" rx="4" fill="#0284c7" />
      <text x="31" y="24" text-anchor="middle" class="mono" font-size="10" font-weight="bold" fill="#ffffff">GET</text>
      <text x="60" y="24" class="mono" font-size="12" font-weight="bold" fill="#38bdf8">/v1/quota</text>
      <text x="145" y="24" class="sub" font-size="11" fill="#94a3b8">Cloud Credit Usage &amp; Daily Allowance Telemetry</text>
    </g>
  </g>

  <!-- Connector Line (Cloud -> Ingestion Core) -->
  <path d="M 600 170 L 600 205" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)" />

  <!-- ================= LEVEL 2: THERMALOS INGESTION & CACHE ================= -->
  <g transform="translate(150, 205)" filter="url(#softGlow)">
    <rect width="900" height="75" rx="14" fill="url(#cardBgDark)" stroke="#6366f1" stroke-width="1.5" />
    
    <text x="24" y="26" class="heading" font-size="13" fill="#818cf8">🛡️ THERMALOS TELEMETRY CORE &amp; PERSISTENT CACHE</text>
    <text x="24" y="50" class="sub" font-size="12" fill="#cbd5e1">Client Engine: <tspan class="mono" fill="#c7d2fe">backend/fortyguard_client.py</tspan></text>
    <text x="24" y="65" class="sub" font-size="11" fill="#64748b">GeoJSON Polygon AOI &amp; Coordinates Resolver for US Metros</text>

    <!-- Cache Module Box -->
    <g transform="translate(560, 16)">
      <rect width="316" height="44" rx="8" fill="#171e38" stroke="#4f46e5" stroke-width="1" />
      <text x="16" y="22" class="heading" font-size="12" fill="#a5b4fc">💾 1-Hour Disk Cache Engine</text>
      <text x="16" y="37" class="mono" font-size="10" fill="#818cf8">backend/cache/ (TTL: 3600s • Quota Guard)</text>
    </g>
  </g>

  <!-- Multi-Branching Connectors to 3 Agents -->
  <path d="M 320 280 L 220 325" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowAmber)" />
  <path d="M 600 280 L 600 325" stroke="#10b981" stroke-width="2" marker-end="url(#arrowEmerald)" />
  <path d="M 880 280 L 980 325" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowRose)" />

  <!-- ================= LEVEL 3: AUTONOMOUS TRI-AGENT SUITE ================= -->
  
  <!-- Agent 1: Compliance Auditor -->
  <g transform="translate(50, 330)" filter="url(#softGlow)">
    <rect width="345" height="195" rx="14" fill="url(#a1Grad)" stroke="#d97706" stroke-width="1.5" />
    
    <!-- Card Header -->
    <rect x="0" y="0" width="345" height="38" rx="14" fill="#451a03" />
    <text x="16" y="24" class="heading" font-size="13" fill="#fbbf24">🤖 AGENT 1: COMPLIANCE AUDITOR</text>
    <text x="325" y="24" text-anchor="end" class="mono" font-size="10" font-weight="bold" fill="#fde68a">RAG</text>

    <!-- Content Items -->
    <text x="16" y="62" class="sub" font-size="12" fill="#fed7aa">• <tspan font-weight="bold">Sol-Air Physics Flux:</tspan> T_sol = Ta + (α·GHI)/ho</text>
    <text x="16" y="85" class="sub" font-size="12" fill="#fed7aa">• <tspan font-weight="bold">ChromaDB Vector Store:</tspan> 256-dim embeddings</text>
    <text x="16" y="108" class="sub" font-size="12" fill="#fed7aa">• <tspan font-weight="bold">Standards:</tspan> ASHRAE 55-2023 &amp; IECC 2024</text>
    <text x="16" y="131" class="sub" font-size="12" fill="#fed7aa">• <tspan font-weight="bold">Scope:</tspan> Envelope thermal resistance degradation</text>

    <!-- Result Pill -->
    <rect x="16" y="148" width="313" height="34" rx="6" fill="#241103" stroke="#b45309" stroke-width="1" />
    <text x="172" y="169" text-anchor="middle" class="mono" font-size="11" font-weight="bold" fill="#fde68a">
      FLAG: -35% Insulation Derate Risk
    </text>
  </g>

  <!-- Agent 2: Pre-Cool Controller -->
  <g transform="translate(427, 330)" filter="url(#softGlow)">
    <rect width="345" height="195" rx="14" fill="url(#a2Grad)" stroke="#059669" stroke-width="1.5" />
    
    <!-- Card Header -->
    <rect x="0" y="0" width="345" height="38" rx="14" fill="#064e3b" />
    <text x="16" y="24" class="heading" font-size="13" fill="#34d399">⚡ AGENT 2: PRE-COOL CONTROLLER</text>
    <text x="325" y="24" text-anchor="end" class="mono" font-size="10" font-weight="bold" fill="#a7f3d0">MPC</text>

    <!-- Content Items -->
    <text x="16" y="62" class="sub" font-size="12" fill="#a7f3d0">• <tspan font-weight="bold">Thermal Inertia Lag:</tspan> τ = 2.0h–3.5h structural</text>
    <text x="16" y="85" class="sub" font-size="12" fill="#a7f3d0">• <tspan font-weight="bold">MPC Load Shifting:</tspan> Pre-cool window 03–07h</text>
    <text x="16" y="108" class="sub" font-size="12" fill="#a7f3d0">• <tspan font-weight="bold">Peak Zenith Shaving:</tspan> Defend 13–17h grid stress</text>
    <text x="16" y="131" class="sub" font-size="12" fill="#a7f3d0">• <tspan font-weight="bold">Target:</tspan> Municipal chiller plant electric demand</text>

    <!-- Result Pill -->
    <rect x="16" y="148" width="313" height="34" rx="6" fill="#021d15" stroke="#047857" stroke-width="1" />
    <text x="172" y="169" text-anchor="middle" class="mono" font-size="11" font-weight="bold" fill="#6ee7b7">
      REDUCTION: 450–780 kW Shaved (35%)
    </text>
  </g>

  <!-- Agent 3: Civic Heat Dispatcher -->
  <g transform="translate(805, 330)" filter="url(#softGlow)">
    <rect width="345" height="195" rx="14" fill="url(#a3Grad)" stroke="#e11d48" stroke-width="1.5" />
    
    <!-- Card Header -->
    <rect x="0" y="0" width="345" height="38" rx="14" fill="#4c0519" />
    <text x="16" y="24" class="heading" font-size="13" fill="#fb7185">🚨 AGENT 3: CIVIC DISPATCHER</text>
    <text x="325" y="24" text-anchor="end" class="mono" font-size="10" font-weight="bold" fill="#fecdd3">n8n</text>

    <!-- Content Items -->
    <text x="16" y="62" class="sub" font-size="12" fill="#fecdd3">• <tspan font-weight="bold">Thermodynamic WBGT:</tspan> Liljegren Index formula</text>
    <text x="16" y="85" class="sub" font-size="12" fill="#fecdd3">• <tspan font-weight="bold">Automated Webhooks:</tspan> JSON payload dispatch</text>
    <text x="16" y="108" class="sub" font-size="12" fill="#fecdd3">• <tspan font-weight="bold">OSHA / ACGIH Limits:</tspan> 15 min/hr outdoor work</text>
    <text x="16" y="131" class="sub" font-size="12" fill="#fecdd3">• <tspan font-weight="bold">Civic Response:</tspan> Misting hubs &amp; cooling shelters</text>

    <!-- Result Pill -->
    <rect x="16" y="148" width="313" height="34" rx="6" fill="#20040b" stroke="#be123c" stroke-width="1" />
    <text x="172" y="169" text-anchor="middle" class="mono" font-size="11" font-weight="bold" fill="#fda4af">
      DISPATCH: Automated Emergency Alerts
    </text>
  </g>

  <!-- Connectors from 3 Agents to Synthesis -->
  <path d="M 220 525 L 480 555" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowAmber)" />
  <path d="M 600 525 L 600 555" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowEmerald)" />
  <path d="M 980 525 L 720 555" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arrowRose)" />

  <!-- ================= LEVEL 4: EXECUTIVE CONSENSUS SYNTHESIS ================= -->
  <g transform="translate(250, 560)" filter="url(#softGlow)">
    <rect width="700" height="50" rx="10" fill="url(#synGrad)" stroke="#c084fc" stroke-width="1.5" />
    <text x="350" y="31" text-anchor="middle" class="heading" font-size="14" fill="#ffffff" letter-spacing="0.5">
      🏛️ EXECUTIVE MUNICIPAL CONSENSUS SYNTHESIS
    </text>
  </g>

  <!-- Connector from Synthesis to UI -->
  <path d="M 600 610 L 600 645" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)" />

  <!-- ================= LEVEL 5: EXECUTIVE COMMAND DECK & VISUALIZATIONS ================= -->
  <g transform="translate(50, 650)" filter="url(#softGlow)">
    <rect width="1100" height="150" rx="14" fill="url(#cardBgDark)" stroke="#334155" stroke-width="1.5" />
    
    <text x="24" y="26" class="heading" font-size="13" fill="#38bdf8" letter-spacing="0.5">
      🖥️ EXECUTIVE COMMAND DECK &amp; HIGH-RESOLUTION VISUALIZATION SUITE
    </text>

    <!-- Component 1: GIS Map -->
    <g transform="translate(24, 42)">
      <rect width="330" height="92" rx="10" fill="#090e18" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="24" class="heading" font-size="12" fill="#38bdf8">🗺️ Leaflet Spatial GIS Heatmap</text>
      <text x="16" y="45" class="sub" font-size="11" fill="#cbd5e1">• 60m / 80m / 100m Microclimate Tiles</text>
      <text x="16" y="64" class="sub" font-size="11" fill="#94a3b8">• Esri Satellite &amp; Dark Carto Basemaps</text>
      <text x="16" y="81" class="mono" font-size="10" fill="#64748b">GeoJSON Vector Grid Overlay</text>
    </g>

    <!-- Component 2: Diurnal Timeline -->
    <g transform="translate(385, 42)">
      <rect width="330" height="92" rx="10" fill="#090e18" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="24" class="heading" font-size="12" fill="#38bdf8">⏱️ 24H Diurnal Forecaster</text>
      <text x="16" y="45" class="sub" font-size="11" fill="#cbd5e1">• 00:00–12:00 Historic Baseline</text>
      <text x="16" y="64" class="sub" font-size="11" fill="#cbd5e1">• 12:00–24:00 AI Predictive Horizon</text>
      <text x="16" y="81" class="mono" font-size="10" fill="#64748b">Pre-Cool (03–07h) &amp; Peak (13–17h)</text>
    </g>

    <!-- Component 3: Phaser Office -->
    <g transform="translate(746, 42)">
      <rect width="330" height="92" rx="10" fill="#090e18" stroke="#1e293b" stroke-width="1" />
      <text x="16" y="24" class="heading" font-size="12" fill="#38bdf8">🎮 Phaser 3 Office Engine</text>
      <text x="16" y="45" class="sub" font-size="11" fill="#cbd5e1">• Real-Time 2D Agent Simulation</text>
      <text x="16" y="64" class="sub" font-size="11" fill="#94a3b8">• Security Doors &amp; Badge Laser Scans</text>
      <text x="16" y="81" class="mono" font-size="10" fill="#64748b">Synchronized Telemetry Canvas</text>
    </g>
  </g>

</svg>
