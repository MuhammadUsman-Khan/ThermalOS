<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 700" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>

    <!-- Card Gradients -->
    <linearGradient id="cloudGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f2b48" />
      <stop offset="100%" stop-color="#172554" />
    </linearGradient>
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="100%" stop-color="#312e81" />
    </linearGradient>
    <linearGradient id="agent1Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#451a03" />
      <stop offset="100%" stop-color="#78350f" />
    </linearGradient>
    <linearGradient id="agent2Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="agent3Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4c0519" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <linearGradient id="synGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b0764" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="uiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b" />
      <stop offset="100%" stop-color="#27272a" />
    </linearGradient>

    <!-- Filters & Shadows -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="6" flood-color="#000000" flood-opacity="0.5" />
    </filter>
    <filter id="glowCyan" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#38bdf8" flood-opacity="0.6" />
    </filter>
    <filter id="glowOrange" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#f97316" flood-opacity="0.6" />
    </filter>

    <!-- Markers for arrows -->
    <marker id="arrowCyan" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#38bdf8" />
    </marker>
    <marker id="arrowOrange" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#f97316" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#10b981" />
    </marker>
    <marker id="arrowPurple" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#a855f7" />
    </marker>
  </defs>

  <!-- Background Canvas -->
  <rect width="1000" height="700" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2" />

  <!-- Title Header -->
  <text x="500" y="38" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="20" font-weight="bold" fill="#f8fafc" letter-spacing="1">
    THERMALOS — SYSTEM ARCHITECTURE
  </text>
  <text x="500" y="58" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" fill="#94a3b8">
    Autonomous Multi-Agent Urban Microclimate Operating System • Powered by FortyGuard Enterprise API
  </text>

  <!-- ================= SECTION 1: FORTYGUARD CLOUD ================= -->
  <g filter="url(#dropShadow)">
    <rect x="50" y="80" width="900" height="85" rx="12" fill="url(#cloudGrad)" stroke="#38bdf8" stroke-width="1.5" />
    <text x="70" y="105" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">☁️ FortyGuard Enterprise Microclimate Platform</text>
    
    <!-- Endpoint 1 -->
    <rect x="70" y="118" width="410" height="35" rx="6" fill="#0b192c" stroke="#1e40af" stroke-width="1" />
    <text x="85" y="140" font-family="monospace" font-size="12" font-weight="bold" fill="#60a5fa">POST /v1/heatmap</text>
    <text x="215" y="140" font-family="sans-serif" font-size="11" fill="#cbd5e1">(60m-100m Radiometry: Ts, Ta, GHI, RH)</text>

    <!-- Endpoint 2 -->
    <rect x="510" y="118" width="420" height="35" rx="6" fill="#0b192c" stroke="#1e40af" stroke-width="1" />
    <text x="525" y="140" font-family="monospace" font-size="12" font-weight="bold" fill="#60a5fa">GET /v1/quota</text>
    <text x="625" y="140" font-family="sans-serif" font-size="11" fill="#cbd5e1">(Real-Time Quota Telemetry &amp; Credit Balance)</text>
  </g>

  <!-- Connector Line 1: Cloud -> Bridge -->
  <path d="M 500 165 L 500 195" stroke="#38bdf8" stroke-width="2" stroke-dasharray="4,4" marker-end="url(#arrowCyan)" />

  <!-- ================= SECTION 2: THERMALOS CORE & CACHE ================= -->
  <g filter="url(#dropShadow)">
    <rect x="180" y="200" width="640" height="70" rx="12" fill="url(#coreGrad)" stroke="#818cf8" stroke-width="1.5" />
    <text x="200" y="225" font-family="sans-serif" font-size="14" font-weight="bold" fill="#a5b4fc">🛡️ ThermalOS Ingestion Core &amp; Smart Disk Caching Layer</text>
    <text x="200" y="248" font-family="sans-serif" font-size="12" fill="#cbd5e1">Client SDK: <tspan font-family="monospace" fill="#c7d2fe">backend/fortyguard_client.py</tspan></text>
    <rect x="560" y="215" width="240" height="40" rx="6" fill="#1e1b4b" stroke="#6366f1" stroke-width="1" />
    <text x="575" y="235" font-family="sans-serif" font-size="11" font-weight="bold" fill="#e0e7ff">💾 1-Hour Disk Cache</text>
    <text x="575" y="249" font-family="sans-serif" font-size="10" fill="#a5b4fc">TTL: 3600s (Quota Protection)</text>
  </g>

  <!-- Connectors from Core to 3 Agents -->
  <path d="M 300 270 L 200 310" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrowOrange)" />
  <path d="M 500 270 L 500 310" stroke="#10b981" stroke-width="2" marker-end="url(#arrowGreen)" />
  <path d="M 700 270 L 800 310" stroke="#f43f5e" stroke-width="2" marker-end="url(#arrowPurple)" />

  <!-- ================= SECTION 3: TRI-AGENT SUITE ================= -->
  
  <!-- Agent 1: Compliance -->
  <g filter="url(#dropShadow)">
    <rect x="50" y="315" width="280" height="150" rx="10" fill="url(#agent1Grad)" stroke="#f59e0b" stroke-width="1.5" />
    <text x="65" y="340" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fbbf24">🤖 Agent 1: Compliance Auditor</text>
    <text x="65" y="365" font-family="sans-serif" font-size="11" fill="#fed7aa">• Sol-Air Envelope Heat Flux</text>
    <text x="65" y="385" font-family="sans-serif" font-size="11" fill="#fed7aa">• ChromaDB RAG Vector Store</text>
    <text x="65" y="405" font-family="sans-serif" font-size="11" fill="#fed7aa">• ASHRAE 55-2023 &amp; IECC 2024</text>
    <rect x="65" y="420" width="250" height="30" rx="4" fill="#291203" stroke="#b45309" />
    <text x="75" y="440" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fde68a">Result: -35% Insulation Derate Flag</text>
  </g>

  <!-- Agent 2: Pre-Cool -->
  <g filter="url(#dropShadow)">
    <rect x="360" y="315" width="280" height="150" rx="10" fill="url(#agent2Grad)" stroke="#10b981" stroke-width="1.5" />
    <text x="375" y="340" font-family="sans-serif" font-size="13" font-weight="bold" fill="#34d399">⚡ Agent 2: Pre-Cool Controller</text>
    <text x="375" y="365" font-family="sans-serif" font-size="11" fill="#a7f3d0">• Concrete Thermal Inertia (2-3.5h)</text>
    <text x="375" y="385" font-family="sans-serif" font-size="11" fill="#a7f3d0">• Off-Peak Morning Shift (03-07h)</text>
    <text x="375" y="405" font-family="sans-serif" font-size="11" fill="#a7f3d0">• Chiller Plant MPC Protocol</text>
    <rect x="375" y="420" width="250" height="30" rx="4" fill="#022c22" stroke="#047857" />
    <text x="385" y="440" font-family="sans-serif" font-size="10" font-weight="bold" fill="#6ee7b7">Result: 450-780 kW Peak Shaved</text>
  </g>

  <!-- Agent 3: Civic -->
  <g filter="url(#dropShadow)">
    <rect x="670" y="315" width="280" height="150" rx="10" fill="url(#agent3Grad)" stroke="#f43f5e" stroke-width="1.5" />
    <text x="685" y="340" font-family="sans-serif" font-size="13" font-weight="bold" fill="#fb7185">🚨 Agent 3: Civic Dispatcher</text>
    <text x="685" y="365" font-family="sans-serif" font-size="11" fill="#fecdd3">• Liljegren WBGT Calculation</text>
    <text x="685" y="385" font-family="sans-serif" font-size="11" fill="#fecdd3">• Automated n8n Webhook Alerts</text>
    <text x="685" y="405" font-family="sans-serif" font-size="11" fill="#fecdd3">• Cooling Shelter &amp; Misting Hub</text>
    <rect x="685" y="420" width="250" height="30" rx="4" fill="#2d0612" stroke="#be123c" />
    <text x="695" y="440" font-family="sans-serif" font-size="10" font-weight="bold" fill="#fda4af">Result: OSHA 15m/h Labor Limits</text>
  </g>

  <!-- Connectors from 3 Agents to Consensus Synthesis -->
  <path d="M 190 465 L 400 495" stroke="#f59e0b" stroke-width="1.5" marker-end="url(#arrowOrange)" />
  <path d="M 500 465 L 500 495" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrowGreen)" />
  <path d="M 810 465 L 600 495" stroke="#f43f5e" stroke-width="1.5" marker-end="url(#arrowPurple)" />

  <!-- ================= SECTION 4: EXECUTIVE CONSENSUS SYNTHESIS ================= -->
  <g filter="url(#dropShadow)">
    <rect x="250" y="500" width="500" height="45" rx="8" fill="url(#synGrad)" stroke="#c084fc" stroke-width="1.5" />
    <text x="500" y="528" text-anchor="middle" font-family="sans-serif" font-size="13" font-weight="bold" fill="#f3e8ff">
      🏛️ Executive Municipal Consensus Directive (Unified Brief)
    </text>
  </g>

  <!-- Connector from Synthesis to UI -->
  <path d="M 500 545 L 500 575" stroke="#a855f7" stroke-width="2" marker-end="url(#arrowPurple)" />

  <!-- ================= SECTION 5: EXECUTIVE COMMAND DECK & UI ================= -->
  <g filter="url(#dropShadow)">
    <rect x="50" y="580" width="900" height="95" rx="12" fill="url(#uiGrad)" stroke="#475569" stroke-width="1.5" />
    <text x="70" y="605" font-family="sans-serif" font-size="14" font-weight="bold" fill="#38bdf8">🖥️ Executive Command Deck &amp; Spatial Analytics Suite</text>
    
    <!-- UI 1 -->
    <rect x="70" y="618" width="270" height="42" rx="6" fill="#090d16" stroke="#334155" />
    <text x="85" y="636" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">🗺️ Leaflet Spatial GIS Heatmap</text>
    <text x="85" y="651" font-family="sans-serif" font-size="10" fill="#94a3b8">60m / 80m / 100m Microclimate Tiles</text>

    <!-- UI 2 -->
    <rect x="365" y="618" width="270" height="42" rx="6" fill="#090d16" stroke="#334155" />
    <text x="380" y="636" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">⏱️ 24H Diurnal Forecaster</text>
    <text x="380" y="651" font-family="sans-serif" font-size="10" fill="#94a3b8">00-12h Baseline / 12-24h AI Forecast</text>

    <!-- UI 3 -->
    <rect x="660" y="618" width="270" height="42" rx="6" fill="#090d16" stroke="#334155" />
    <text x="675" y="636" font-family="sans-serif" font-size="11" font-weight="bold" fill="#38bdf8">🎮 Phaser 3 Office Engine</text>
    <text x="675" y="651" font-family="sans-serif" font-size="10" fill="#94a3b8">Live Autonomous Agent Telemetry</text>
  </g>

</svg>
